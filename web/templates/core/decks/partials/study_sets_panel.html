<div id="study-sets-panel" class="space-y-4">
    <div id="study-set-list">
        {% include 'core/decks/partials/study_sets.html' %}
    </div>
    <details class="rounded border border-dashed bg-white/70 px-4 py-3 text-sm text-gray-600">
        <summary class="cursor-pointer text-sm font-semibold text-gray-700">Create new study preset</summary>
        <div class="mt-3">
            {% include 'core/decks/partials/study_set_form.html' %}
        </div>
    </details>
</div>
<script>
document.addEventListener('change', function(e) {
    if (e.target.name === 'kind') {
        const radio = e.target;
        const deckField = document.getElementById('deck-field');
        const tagField = document.getElementById('tag-field');
        const customFields = document.getElementById('custom-fields');
        if (deckField && tagField && customFields) {
            if (radio.value === 'deck') {
                deckField.style.display = 'block';
                tagField.style.display = 'none';
                customFields.style.display = 'none';
            } else if (radio.value === 'tag') {
                deckField.style.display = 'none';
                tagField.style.display = 'block';
                customFields.style.display = 'none';
            } else if (radio.value === 'custom') {
                deckField.style.display = 'none';
                tagField.style.display = 'none';
                customFields.style.display = 'block';
            }
        }
    }
});

// Trigger on load if already selected
document.addEventListener('DOMContentLoaded', function() {
    const selected = document.querySelector('input[name="kind"]:checked');
    if (selected) selected.dispatchEvent(new Event('change'));
});

document.addEventListener('keyup', function(e) {
    if (e.target.classList.contains('search-input')) {
        console.log('search input event', e.target.value);
        const searchInput = e.target;
        const targetId = searchInput.getAttribute('data-target');
        console.log('targetId', targetId);
        const container = document.getElementById(targetId);
        console.log('container', container);
        if (container) {
            const listElement = container.querySelector('ul') || container.querySelector('div');
            console.log('listElement', listElement);
            if (listElement) {
                const itemSelector = listElement.tagName === 'UL' ? 'li' : 'div';
                console.log('itemSelector', itemSelector);
                const items = listElement.querySelectorAll(itemSelector);
                console.log('items', items.length);
                const filter = searchInput.value.toLowerCase().trim();
                console.log('filter', filter);
                items.forEach(item => {
                    const label = item.querySelector('label');
                    const text = label ? label.textContent.toLowerCase().trim() : '';
                    console.log('text', text, 'includes', text.includes(filter));
                    item.style.display = text.includes(filter) ? '' : 'none';
                });
            }
        }
    }
});
</script>
